name: Awesome Lint

on:
  pull_request:
    paths:
      - 'readme.md'
      - '.github/workflows/awesome-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run awesome-lint
        run: npx awesome-lint readme.md
